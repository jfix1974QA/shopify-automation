name: Storefront tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      packs:
        description: 'Packs to run (comma separated): ui,functional,non-functional,api,regression'
        default: 'ui,functional,non-functional,api,regression'
      file_issues:
        description: 'File GitHub issues for failed tests'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: storefront-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  STORE_URL: ${{ vars.STORE_URL || 'https://james-qa-shop.myshopify.com' }}
  STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  WORKERS: 2

jobs:
  # Each test pack runs on its own runner, in parallel. Separate runners also spread
  # traffic across IPs, which keeps Shopify's per-IP rate limiting from kicking in.
  test:
    name: ${{ matrix.pack }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - pack: ui
            args: --project=ui --project=ui-mobile
          - pack: functional
            args: --project=functional
          - pack: non-functional
            args: --project=non-functional
          - pack: api
            args: --project=api
          - pack: regression
            args: --project=regression
    steps:
      - name: Skip packs not selected
        id: select
        run: |
          packs="${{ github.event.inputs.packs || 'ui,functional,non-functional,api,regression' }}"
          if [[ ",${packs// /}," == *",${{ matrix.pack }},"* ]]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.select.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.select.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.select.outputs.run == 'true'
        run: npm ci

      - name: Install browsers
        if: steps.select.outputs.run == 'true'
        run: npx playwright install --with-deps chromium ${{ matrix.pack == 'ui' && 'webkit' || '' }}

      - name: Type-check
        if: steps.select.outputs.run == 'true'
        run: npx tsc --noEmit

      - name: Run ${{ matrix.pack }} pack
        if: steps.select.outputs.run == 'true'
        run: npx playwright test ${{ matrix.args }}

      - name: Upload blob report
        if: always() && steps.select.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blob-${{ matrix.pack }}
          path: reports/blob
          retention-days: 7

      - name: Upload new visual baselines
        # First CI run records Linux baselines. Download and commit them so later runs compare against them.
        if: always() && matrix.pack == 'regression' && steps.select.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: tests/regression/__screenshots__/linux
          if-no-files-found: ignore

  report:
    name: Test report
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit refreshed qa-reports/
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-*
          path: all-blobs
          merge-multiple: true

      - name: Merge into one report (HTML, JUnit, summary, bug drafts)
        run: npx playwright merge-reports --config merge.config.ts all-blobs

      - name: Build QA reports (execution, scenarios, defects)
        run: npm run qa-reports

      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            reports/html
            reports/summary.html
            reports/summary.json
            reports/assets
            reports/bugs
            reports/junit.xml
            qa-reports
          retention-days: 30

      - name: Write job summary
        run: node scripts/ci-summary.mjs summary

      - name: Commit refreshed QA reports
        # Keeps qa-reports/ in the repository up to date. [skip ci] stops this commit triggering another run.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa-reports
          if git diff --cached --quiet; then echo "QA reports unchanged"; exit 0; fi
          git commit -m "Update QA reports from run ${{ github.run_number }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Raise GitHub issues (confirmed defects + failures needing triage)
        # Not on pull requests: failures there belong to the PR, not the issue tracker.
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.file_issues == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/file-github-issues.mjs reports/summary.json qa/defects.json

      - name: Fail the workflow if any test really failed
        run: node scripts/ci-summary.mjs check
