<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 172" width="720" height="172" role="img" aria-label="Defects by area and severity" class="viz" font-family="system-ui,-apple-system,Segoe UI,sans-serif" style="max-width:100%;height:auto">
<style>svg{
  --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --grid:#e4e3df;
  --good:#0ca30c; --critical:#d03b3b; --serious:#ec835a; --warning:#fab219; --neutral:#b5b4ae;
  --s1:#2a78d6;
  --seq-0:#f0efec; --seq-1:#cde2fb; --seq-2:#9ec5f4; --seq-3:#5598e7; --seq-4:#256abf; --seq-5:#104281;} @media (prefers-color-scheme:dark){svg{
  --surface:#1a1a19; --ink:#f0efec; --ink-2:#c3c2b7; --grid:#383835; --neutral:#6b6a65;
  --s1:#3987e5;
  --seq-0:#2a2a28; --seq-1:#0d366b; --seq-2:#184f95; --seq-3:#256abf; --seq-4:#3987e5; --seq-5:#86b6ef;}}</style>
<title>Defects by area and severity</title>
<rect width="720" height="172" rx="8" fill="var(--surface)"/>
<rect x="170" y="13" width="10" height="10" rx="2" fill="var(--critical)"/><text x="185" y="22" font-size="12" fill="var(--ink-2)">Critical</text><rect x="252" y="13" width="10" height="10" rx="2" fill="var(--serious)"/><text x="267" y="22" font-size="12" fill="var(--ink-2)">High</text><rect x="306" y="13" width="10" height="10" rx="2" fill="var(--warning)"/><text x="321" y="22" font-size="12" fill="var(--ink-2)">Medium</text><rect x="374" y="13" width="10" height="10" rx="2" fill="var(--neutral)"/><text x="389" y="22" font-size="12" fill="var(--ink-2)">Low</text><text x="160" y="53" font-size="12" fill="var(--ink)" text-anchor="end">Accessibility</text><rect x="170.0" y="40" width="243.0" height="18" rx="3" fill="var(--warning)"><title>Accessibility - Medium: 1</title></rect>
<text x="421.0" y="53" font-size="12" fill="var(--ink-2)">1</text><text x="160" y="83" font-size="12" fill="var(--ink)" text-anchor="end">Content</text><rect x="170.0" y="70" width="488.0" height="18" rx="3" fill="var(--warning)"><title>Content - Medium: 2</title></rect>
<text x="666.0" y="83" font-size="12" fill="var(--ink-2)">2</text><text x="160" y="113" font-size="12" fill="var(--ink)" text-anchor="end">SEO</text><rect x="170.0" y="100" width="243.0" height="18" rx="3" fill="var(--warning)"><title>SEO - Medium: 1</title></rect><rect x="415.0" y="100" width="243.0" height="18" rx="3" fill="var(--neutral)"><title>SEO - Low: 1</title></rect>
<text x="666.0" y="113" font-size="12" fill="var(--ink-2)">2</text><text x="160" y="143" font-size="12" fill="var(--ink)" text-anchor="end">Security</text><rect x="170.0" y="130" width="243.0" height="18" rx="3" fill="var(--neutral)"><title>Security - Low: 1</title></rect>
<text x="421.0" y="143" font-size="12" fill="var(--ink-2)">1</text>
</svg>