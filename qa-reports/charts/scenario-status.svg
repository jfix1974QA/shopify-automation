<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" width="460" height="220" role="img" aria-label="Test case outcomes" class="viz" font-family="system-ui,-apple-system,Segoe UI,sans-serif" style="max-width:100%;height:auto">
<style>svg{
  --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --grid:#e4e3df;
  --good:#0ca30c; --critical:#d03b3b; --serious:#ec835a; --warning:#fab219; --neutral:#b5b4ae;
  --s1:#2a78d6;
  --seq-0:#f0efec; --seq-1:#cde2fb; --seq-2:#9ec5f4; --seq-3:#5598e7; --seq-4:#256abf; --seq-5:#104281;} @media (prefers-color-scheme:dark){svg{
  --surface:#1a1a19; --ink:#f0efec; --ink-2:#c3c2b7; --grid:#383835; --neutral:#6b6a65;
  --s1:#3987e5;
  --seq-0:#2a2a28; --seq-1:#0d366b; --seq-2:#184f95; --seq-3:#256abf; --seq-4:#3987e5; --seq-5:#86b6ef;}}</style>
<title>Test case outcomes</title>
<rect width="460" height="220" rx="8" fill="var(--surface)"/>
<path d="M 110.00,30.00 A 80 80 0 1 1 75.29,182.08 L 86.57,158.65 A 54 54 0 1 0 110.00,56.00 Z" fill="var(--good)" stroke="var(--surface)" stroke-width="2" fill-rule="evenodd"><title>Passed: 44 (57%)</title></path><path d="M 75.29,182.08 A 80 80 0 0 1 49.54,162.39 L 69.19,145.36 A 54 54 0 0 0 86.57,158.65 Z" fill="var(--critical)" stroke="var(--surface)" stroke-width="2" fill-rule="evenodd"><title>Failed: 5 (6%)</title></path><path d="M 49.54,162.39 A 80 80 0 0 1 84.35,34.22 L 92.69,58.85 A 54 54 0 0 0 69.19,145.36 Z" fill="var(--serious)" stroke="var(--surface)" stroke-width="2" fill-rule="evenodd"><title>Blocked: 24 (31%)</title></path><path d="M 84.35,34.22 A 80 80 0 0 1 110.00,30.00 L 110.00,56.00 A 54 54 0 0 0 92.69,58.85 Z" fill="var(--neutral)" stroke="var(--surface)" stroke-width="2" fill-rule="evenodd"><title>Skipped: 4 (5%)</title></path>
<text x="110" y="112" text-anchor="middle" font-size="26" font-weight="700" fill="var(--ink)">77</text>
<text x="110" y="132" text-anchor="middle" font-size="11" fill="var(--ink-2)">test cases</text>
<rect x="240" y="52" width="12" height="12" rx="2" fill="var(--good)"/>
<text x="260" y="62" font-size="13" fill="var(--ink)">Passed</text>
<text x="440" y="62" font-size="13" fill="var(--ink)" text-anchor="end" font-weight="600">44 <tspan fill="var(--ink-2)" font-weight="400">(57%)</tspan></text><rect x="240" y="80" width="12" height="12" rx="2" fill="var(--critical)"/>
<text x="260" y="90" font-size="13" fill="var(--ink)">Failed</text>
<text x="440" y="90" font-size="13" fill="var(--ink)" text-anchor="end" font-weight="600">5 <tspan fill="var(--ink-2)" font-weight="400">(6%)</tspan></text><rect x="240" y="108" width="12" height="12" rx="2" fill="var(--serious)"/>
<text x="260" y="118" font-size="13" fill="var(--ink)">Blocked</text>
<text x="440" y="118" font-size="13" fill="var(--ink)" text-anchor="end" font-weight="600">24 <tspan fill="var(--ink-2)" font-weight="400">(31%)</tspan></text><rect x="240" y="136" width="12" height="12" rx="2" fill="var(--warning)"/>
<text x="260" y="146" font-size="13" fill="var(--ink)">Flaky</text>
