<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" width="460" height="220" role="img" aria-label="Quality gates" class="viz" font-family="system-ui,-apple-system,Segoe UI,sans-serif" style="max-width:100%;height:auto">
<style>svg{
  --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --grid:#e4e3df;
  --good:#0ca30c; --critical:#d03b3b; --serious:#ec835a; --warning:#fab219; --neutral:#b5b4ae;
  --s1:#2a78d6;
  --seq-0:#f0efec; --seq-1:#cde2fb; --seq-2:#9ec5f4; --seq-3:#5598e7; --seq-4:#256abf; --seq-5:#104281;} @media (prefers-color-scheme:dark){svg{
  --surface:#1a1a19; --ink:#f0efec; --ink-2:#c3c2b7; --grid:#383835; --neutral:#6b6a65;
  --s1:#3987e5;
  --seq-0:#2a2a28; --seq-1:#0d366b; --seq-2:#184f95; --seq-3:#256abf; --seq-4:#3987e5; --seq-5:#86b6ef;}}</style>
<title>Quality gates</title>
<rect width="460" height="220" rx="8" fill="var(--surface)"/>
<path d="M 110.00,30.00 A 80 80 0 0 1 190.00,110.00 L 164.00,110.00 A 54 54 0 0 0 110.00,56.00 Z" fill="var(--good)" stroke="var(--surface)" stroke-width="2" fill-rule="evenodd"><title>Met: 2 (25%)</title></path><path d="M 190.00,110.00 A 80 80 0 1 1 110.00,30.00 L 110.00,56.00 A 54 54 0 1 0 164.00,110.00 Z" fill="var(--critical)" stroke="var(--surface)" stroke-width="2" fill-rule="evenodd"><title>Not met: 6 (75%)</title></path>
<text x="110" y="112" text-anchor="middle" font-size="26" font-weight="700" fill="var(--ink)">2/8</text>
<text x="110" y="132" text-anchor="middle" font-size="11" fill="var(--ink-2)">gates met</text>
<rect x="240" y="52" width="12" height="12" rx="2" fill="var(--good)"/>
<text x="260" y="62" font-size="13" fill="var(--ink)">Met</text>
<text x="440" y="62" font-size="13" fill="var(--ink)" text-anchor="end" font-weight="600">2 <tspan fill="var(--ink-2)" font-weight="400">(25%)</tspan></text><rect x="240" y="80" width="12" height="12" rx="2" fill="var(--critical)"/>
<text x="260" y="90" font-size="13" fill="var(--ink)">Not met</text>
<text x="440" y="90" font-size="13" fill="var(--ink)" text-anchor="end" font-weight="600">6 <tspan fill="var(--ink-2)" font-weight="400">(75%)</tspan></text>
</svg>