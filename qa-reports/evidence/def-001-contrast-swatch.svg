<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230" font-family="system-ui,-apple-system,Segoe UI,sans-serif" role="img" aria-label="Sale badge colour contrast: current 2.22 to 1 fails, two recommended options pass">
  <title>Sale badge colour contrast: current vs recommended</title>
  <rect width="640" height="230" rx="8" fill="#fcfcfb"/>
  <text x="20" y="30" font-size="14" font-weight="600" fill="#0b0b0b">"Sale" badge contrast (12px text, WCAG 2.1 AA needs 4.5:1)</text>

  <g transform="translate(20,52)">
    <rect width="180" height="120" rx="8" fill="#ffffff" stroke="#e4e3df"/>
    <rect x="50" y="34" width="80" height="30" rx="15" fill="#45c0b6"/>
    <text x="90" y="54" font-size="12" text-anchor="middle" fill="#ffffff">Sale</text>
    <text x="90" y="92" font-size="12" text-anchor="middle" fill="#0b0b0b" font-weight="600">Current: 2.22:1</text>
    <text x="90" y="110" font-size="11" text-anchor="middle" fill="#d03b3b">✗ Fails AA</text>
  </g>
  <g transform="translate(230,52)">
    <rect width="180" height="120" rx="8" fill="#ffffff" stroke="#e4e3df"/>
    <rect x="50" y="34" width="80" height="30" rx="15" fill="#45c0b6"/>
    <text x="90" y="54" font-size="12" text-anchor="middle" fill="#121212">Sale</text>
    <text x="90" y="92" font-size="12" text-anchor="middle" fill="#0b0b0b" font-weight="600">Option A: 8.45:1</text>
    <text x="90" y="110" font-size="11" text-anchor="middle" fill="#0a7a0a">✓ Passes AA and AAA</text>
  </g>
  <g transform="translate(440,52)">
    <rect width="180" height="120" rx="8" fill="#ffffff" stroke="#e4e3df"/>
    <rect x="50" y="34" width="80" height="30" rx="15" fill="#1f7a73"/>
    <text x="90" y="54" font-size="12" text-anchor="middle" fill="#ffffff">Sale</text>
    <text x="90" y="92" font-size="12" text-anchor="middle" fill="#0b0b0b" font-weight="600">Option B: 5.13:1</text>
    <text x="90" y="110" font-size="11" text-anchor="middle" fill="#0a7a0a">✓ Passes AA</text>
  </g>
  <text x="20" y="196" font-size="11" fill="#52514e">Current: #ffffff on #45c0b6 (measured by axe-core). A: #121212 text on #45c0b6. B: #ffffff on #1f7a73.</text>
  <text x="20" y="214" font-size="11" fill="#52514e">Illustration built from the computed colours reported by axe; not a screenshot.</text>
</svg>
